[package]
name = "helwasm"
version = "0.1.0"
authors = ["ok2"]
edition = "2021"

[lib]
name = "helwasm"
path = "src/lib.rs"
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hel = { version = "0.1.0", path = "../hel" }
lazy_static = "1.5.0"
wasm-bindgen = "0.2.126"
parking_lot = "0.12.5"
console_error_panic_hook = "0.1.7"
