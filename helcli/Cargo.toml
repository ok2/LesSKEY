[package]
name = "helcli"
version = "0.1.0"
authors = ["ok2"]
edition = "2021"

[[bin]]
name = "hel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hel = { version = "0.1.0", path = "../hel" }
# ureq 3 is a full API rewrite of notion.rs (untestable without a live token);
# stay on latest 2.x for now and migrate separately.
ureq = { version = "2.12.1", features = ["json"] }   # blocking HTTP, rustls default — no openssl
serde_json = "1"
